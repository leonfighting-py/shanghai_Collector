        <circle cx="100" cy="53" r="9"/>
        <rect x="94.5" y="58" width="11" height="18"/>
        <circle cx="100" cy="91" r="18"/>
        <path d="M91 104 L80 122 L87 122 L97 107 Z M109 104 L120 122 L113 122 L103 107 Z M97 106 h6 v16 h-6z"/>

      <rect width="200" height="200" fill="#fff"/>
      <circle cx="46" cy="138" r="12" fill="#000"/>
      <circle cx="154" cy="138" r="12" fill="#000"/>
    </mask>
  </defs>
  <rect width="200" height="200" fill="#c4472a"/>
  <g transform="translate(100 100) scale(.92) translate(-100 -100)">

name: Database Backup

# 每天把 public schema 全量 dump 一份，存到 GitHub Release（永久保留）+ 可选的对象存储（第二份）。
#
# 为什么需要（2026-10-07/08 事故）：
#   Supabase 项目被暂停后生产数据整体不可达。当时靠「重跑采集」补救回了 events 表，
#   但 raw_events 原始层和 collection_runs 历史运行记录没有第二份，丢了就是丢了。
#   备份的另一半价值是日常回滚 —— 某次采集把窗口写脏时能回到昨天。
#
# 设计约束（改动前请先读）：
#   · 必须装 PostgreSQL 17 客户端。服务器是 PG 17，pg_dump 不向前兼容，
#     用 ubuntu 自带的 16 会直接报 "server version 17.x is not supported"。
#   · 不用 Actions Artifacts 存 —— 它默认 90 天过期，那不是「最后一道防线」。
#   · 失败必须推飞书：备份悄悄停掉是这类体系最危险的失效方式。
#   · 第二路是 provider 无关的：任何兼容 S3 协议的对象存储都能接（腾讯云 COS /
#     阿里云 OSS / B2 / S3 / MinIO …）。**不绑定 Cloudflare R2** —— 2026-10-08 起
#     特意去掉了 R2 的专用配置，因为 Cloudflare 侧当时正因 Worker 顶在 CPU 上限上
#     而间歇性 503，不适合把「最后一道防线」放在同一个平台上。
on:
  schedule:
    # 05:00 UTC = 北京时间 13:00。排在采集（01:00 UTC）和清理（03:00 UTC）之后，
    # 这样每天拿到的都是当天最新发布结果。
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  BACKUP_KEEP: "30"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # 创建 / 删除 Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # ⚠️ 不能直接用 PATH 上的 pg_dump。runner 镜像预装了 postgresql-client-16，
          # /usr/bin/pg_dump 指向它，装了 17 也不会自动切换 —— 实测第一次跑就是
          # 「server version: 17.6; pg_dump version: 16.15」直接中止。
          # 显式指向版本化路径，并把版本打进日志便于排查。
          echo "PG_DUMP_BIN=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=/usr/lib/postgresql/17/bin/pg_restore" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 第二路（可选）：任何兼容 S3 协议的对象存储。5 个变量配齐即自动启用；
          # 不配就只写 Release，不需要改代码。endpoint 必填 —— 不填的话 aws CLI 会
          # 默认打到 AWS S3 上，变成「静默传到另一个地方」，比不传更危险。
          #   腾讯云 COS：BACKUP_S3_ENDPOINT=https://cos.ap-shanghai.myqcloud.com
          #   阿里云 OSS：BACKUP_S3_ENDPOINT=https://oss-cn-shanghai.aliyuncs.com
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: node scripts/backup-db.mjs

      - name: Summarise
        if: always()
        run: |
          {
            echo "## 数据库备份"
            echo ""
            echo "- 保留策略：最近 ${BACKUP_KEEP} 份，滚动删除更早的"
            echo "- 存储：GitHub Release（配齐 BACKUP_S3_* 时同时写一份到对象存储，provider 无关）"
            echo "- 文件校验：pg_restore --list 必须能列出 events / raw_events / collection_runs / source_configs"
            echo "- 失败时会推飞书告警"
          } >> "$GITHUB_STEP_SUMMARY"

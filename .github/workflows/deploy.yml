name: Deploy

# 推送到 main 时自动构建并部署前端到 Cloudflare Workers。
# 也支持在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一个部署任务；新的 push 会取消正在跑的旧部署，避免堆积。
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 先用 opennextjs-cloudflare 构建（产出 .open-next/），deploy 步骤不会自动构建。
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      # wrangler 通过 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 鉴权（无需浏览器登录）。
      # deploy 会先用 getPlatformProxy 解析运行时 env，wrangler 要求 Hyperdrive 有本地连接串；
      # 部署到云端时并不真正使用它，设占位符让检查通过即可（真实连接由 Hyperdrive 云端配置接管）。
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm run deploy:cloudflare

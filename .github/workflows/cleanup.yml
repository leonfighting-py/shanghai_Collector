name: Cleanup Old Data

on:
  schedule:
    - cron: "0 2 1 */2 *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Run cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run cleanup

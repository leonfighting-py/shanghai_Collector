name: Cleanup Old Data

on:
  schedule:
    # 每天 03:00 UTC（= 北京时间 11:00）跑一次。
    # ⚠️ 历史 bug：这里曾写成 "0 2 1 */2 *"。cron 五个字段是「分 时 日 月 周」，
    #    那个 */2 落在了「月」字段上，等价于「奇数月 1 号」——一年只跑 6 次，
    #    于是过期数据一路堆了三个月。要表达"每 2 天"应写在「日」字段：
    #    对比 collect.yml 的正确写法 "0 1 */2 * *"。
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Run cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/cleanup-local.js
